services:
  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.smtp.hostname=0.0.0.0 -Dgreenmail.smtp.port=3025
        -Dgreenmail.imap.hostname=0.0.0.0 -Dgreenmail.imap.port=3143
        -Dgreenmail.users=alice:test-password@example.com,bob:test-password@example.com
        -Dgreenmail.users.login=email
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3143:3143'
