services:
  mailisle:
    build:
      context: .
      args:
        MAIL_BUILD_REVISION: ${MAIL_BUILD_REVISION:-}
    restart: unless-stopped
    env_file: .env
    environment:
      MAIL_DATA_DIR: /app/.data
    ports:
      - '${MAIL_BIND_IP:-0.0.0.0}:${MAIL_PORT:-3000}:${MAIL_PORT:-3000}'
    volumes:
      - mailisle-data:/app/.data
      - ./certs:/app/certs:ro

volumes:
  mailisle-data:
